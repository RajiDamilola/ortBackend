<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask an Engineer — ORT WATT</title>
<meta name="description" content="Describe what you need to power and an ORT engineer will tell you what fits.">
<meta name="color-scheme" content="light">
<script>try{var m=localStorage.getItem('ort-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',m);document.querySelector('meta[name="color-scheme"]').setAttribute('content',m);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/components.css">

</head>
<body data-page-title="nav.ask" data-page-desc="ask.sub">
<div id="slot-gate"></div>
<div id="slot-header"></div>
<main id="main">

  <section class="phead">
    <div class="phead-in">
      <nav class="crumbs"><a href="index.html" data-t="err.home"></a> <span>/</span> <span data-t="nav.engineering"></span></nav>
      <h1 data-t="ask.title"></h1>
      <p class="lede" data-t="ask.sub"></p>
    </div>
  </section>
  <!-- Two routes to the same engineers. WhatsApp is presented first
       and marked as the faster one; the form is the honest choice when
       files are involved, and states its own response time. -->
  <section class="wrap" style="padding-block:var(--sec) 0">
    <div class="sec-head rv">
      <div>
        <p class="code" data-t="nav.ask"></p>
        <h2 class="t-h2" data-t="ask.routeTitle"></h2>
      </div>
      <p class="lede" data-t="ask.routeSub"></p>
    </div>

    <div class="routes">
      <!-- Route 1: WhatsApp -->
      <a class="route route-wa rv" id="wa-route" href="#" target="_blank" rel="noopener">
        <span class="route-top">
          <span class="route-ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35z"/><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.15l-.3-.18-3.1.81.83-3.02-.2-.31A8.2 8.2 0 1112 20.2z"/></svg></span>
          <span class="route-speed route-speed-fast" data-t="ask.waSpeed"></span>
        </span>
        <h3 data-t="ask.waTitle"></h3>
        <p data-t="ask.waBody"></p>
        <span class="route-best">
          <span class="route-best-k" data-t="ask.waBest"></span>
          <span class="route-b"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="ask.waB1"></span></span>
          <span class="route-b"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="ask.waB2"></span></span>
          <span class="route-b"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="ask.waB3"></span></span>
        </span>
        <span class="btn btn-wa route-cta"><span data-t="ask.waCta"></span> <span class="arw">&rarr;</span></span>
      </a>

      <!-- Route 2: the form -->
      <a class="route route-form rv d1" href="#enquiry">
        <span class="route-top">
          <span class="route-ico">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M14 3v5h5M9 13h6M9 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="route-speed" data-t="ask.formSpeed"></span>
        </span>
        <h3 data-t="ask.formTitle"></h3>
        <p data-t="ask.formBody"></p>
        <span class="route-best">
          <span class="route-best-k" data-t="ask.formBest"></span>
          <span class="route-b"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="ask.formB1"></span></span>
          <span class="route-b"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="ask.formB2"></span></span>
          <span class="route-b"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="ask.formB3"></span></span>
        </span>
        <span class="btn btn-line route-cta"><span data-t="ask.formCta"></span> <span class="arw">&darr;</span></span>
      </a>
    </div>
  </section>

  <section class="sec wrap" id="enquiry">
    <div class="note rv" style="margin-block-end:var(--blk)">
      <p data-t="ask.heavyNote"></p>
    </div>
    <div class="split r top">
      <div class="rv d1" style="border:1px solid var(--hair);padding:clamp(1.5rem,3vw,2.5rem)">
        <h3 class="t-h3" style="margin-block-end:1.25rem" data-t="ask.formHeading"></h3>
        <form class="form" id="ask-form" novalidate>
          <div class="msg err" hidden></div><div class="msg ok" hidden></div>
          <div class="f2">
  <div class="fld">
    <label for="full_name"><span data-t="form.fullName"></span></label>
    <input id="full_name" name="full_name" type="text" required data-t-ph="form.namePh">
    <div class="err-msg"></div>
  </div>
  <div class="fld">
    <label for="email"><span data-t="form.email"></span></label>
    <input id="email" name="email" type="email" required data-t-ph="form.emailPh">
    <div class="err-msg"></div>
  </div></div>
          <div class="f2">
  <div class="fld">
    <label for="country"><span data-t="form.country"></span></label>
    <input id="country" name="country" type="text" required>
    <div class="err-msg"></div>
  </div>
  <div class="fld">
    <label for="city"><span data-t="form.city"></span></label>
    <input id="city" name="city" type="text" data-t-ph="form.cityPh">
    <div class="err-msg"></div>
  </div></div>
          
  <div class="fld">
    <label for="mobile"><span data-t="form.mobile"></span> <span class="opt">(<span data-t="form.optional"></span>)</span></label>
    <input id="mobile" name="mobile" type="tel">
    <div class="err-msg"></div>
  </div>
          
  <div class="fld">
    <label for="message" data-t="form.askLabel"></label>
    <textarea id="message" name="message" required data-t-ph="form.askPh"></textarea>
    <div class="err-msg"></div>
  </div>
          
  <div class="fld">
    <label for="files"><span data-t="form.files"></span> <span class="opt">(<span data-t="form.optional"></span>)</span></label>
    <input id="files" name="files" type="file" multiple accept="image/*,.pdf">
    <div class="hint" data-t="form.billHint"></div>
  </div>
          <button class="btn btn-signal" type="submit"><span data-t="form.send"></span> <span class="arw">→</span></button>
        </form>
      </div>
      <aside class="rv">
        <div class="idx"><b>01</b> <span data-t="ask.next"></span></div>
        <div class="ledger" style="margin-block-start:1.5rem">
          <div class="led" style="grid-template-columns:2.5rem 1fr"><span class="led-n">1</span><p data-t="ask.n1"></p></div><div class="led" style="grid-template-columns:2.5rem 1fr"><span class="led-n">2</span><p data-t="ask.n2"></p></div><div class="led" style="grid-template-columns:2.5rem 1fr"><span class="led-n">3</span><p data-t="ask.n3"></p></div>
        </div>
        <div style="border:1px solid var(--hair);padding:1.35rem;margin-block-start:1.75rem">
          <h4 class="t-h3" style="font-size:1rem" data-t="ask.fullStudy"></h4>
          <p class="sm muted" style="margin-block-start:.5rem" data-t="ask.fullStudyBody"></p>
          <a class="lnk lnk-signal" style="margin-block-start:.9rem" href="solar-study.html"><span data-t="ask.fullStudyCta"></span> <span class="arw">→</span></a>
        </div>
      </aside>
    </div>
  </section>
</main>
<div id="slot-footer"></div>
<script src="js/theme.js"></script>
<script src="js/strings.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/phone.js"></script>
<script src="js/layout.js"></script>
<script>ortWireForm('ask-form','ask_engineer');
    const sp=new URLSearchParams(location.search).get('p');
    if(sp){const pr=ORT_PRODUCTS.find(x=>x.slug===sp);const ta=document.getElementById('message');
      if(pr&&ta)ta.value=pr.brand+' '+pr.model+' — ';}</script>
<script>
  // Built at runtime so the pre-filled message is in the chosen language.
  function wireAskWa(){ const a=document.getElementById('wa-route'); if(a) a.href = ortWhatsApp(); }
  document.addEventListener('DOMContentLoaded', wireAskWa);
  document.addEventListener('ort:lang', wireAskWa);
</script>
</body>
</html>
