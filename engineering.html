<script>
(function(){
  const SERVICES=['design','sizing','selection','study','commissioning','trouble','maintenance','support'];
  const LINK={study:'solar-study.html',maintenance:'maintenance-repair.html',
              support:'ask-an-engineer.html',selection:'equipment.html'};
  function render(){
    const g=document.getElementById('eng-grid'); if(!g) return;
    g.innerHTML=SERVICES.map(k=>`
      <a class="svc" href="${LINK[k]||'ask-an-engineer.html'}">
        ${ILL[k]}
        <h4>${t('svc.'+k)}</h4>
        <p>${t('svc.'+k+'D')}</p>
        <span class="svc-cta">${t('common.learnMore')} <span class="arw">→</span></span>
      </a>`).join('');
    ortReveal();
  }
  document.addEventListener('DOMContentLoaded',render);
  document.addEventListener('ort:lang',render);
})();
