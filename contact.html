<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — ORT WATT</title>
<meta name="description" content="Contact ORT WATT in Dubai.">
<meta name="color-scheme" content="light">
<script>try{var m=localStorage.getItem('ort-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',m);document.querySelector('meta[name="color-scheme"]').setAttribute('content',m);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body data-page-title="nav.contact" data-page-desc="contact.sub">
<div id="slot-gate"></div>
<div id="slot-header"></div>
<main id="main">

  <section class="phead">
    <div class="phead-in">
      <nav class="crumbs"><a href="index.html" data-t="err.home"></a> <span>/</span> <span data-t="nav.contact"></span></nav>
      <h1 data-t="contact.title"></h1>
      <p class="lede" data-t="contact.sub"></p>
    </div>
  </section>
  <section class="sec wrap">
    <div class="split r top">
      <div class="rv d1" style="border:1px solid var(--hair);padding:clamp(1.5rem,3vw,2.5rem)">
        <h3 class="t-h3" style="margin-block-end:1.5rem" data-t="contact.sendMessage"></h3>
        <form class="form" id="contact-form" novalidate>
          <div class="msg err" hidden></div><div class="msg ok" hidden></div>
          <div class="f2">
  <div class="fld">
    <label for="full_name"><span data-t="form.fullName"></span></label>
    <input id="full_name" name="full_name" type="text" required data-t-ph="form.namePh">
    <div class="err-msg"></div>
  </div>
  <div class="fld">
    <label for="email"><span data-t="form.email"></span></label>
    <input id="email" name="email" type="email" required data-t-ph="form.emailPh">
    <div class="err-msg"></div>
  </div></div>
          <div class="f2">
  <div class="fld">
    <label for="country"><span data-t="form.country"></span></label>
    <input id="country" name="country" type="text">
    <div class="err-msg"></div>
  </div>
  <div class="fld">
    <label for="mobile"><span data-t="form.mobile"></span> <span class="opt">(<span data-t="form.optional"></span>)</span></label>
    <input id="mobile" name="mobile" type="tel">
    <div class="err-msg"></div>
  </div></div>
          
  <div class="fld">
    <label for="message" data-t="form.message"></label>
    <textarea id="message" name="message" required data-t-ph="form.askPh"></textarea>
    <div class="err-msg"></div>
  </div>
          <button class="btn btn-signal" type="submit"><span data-t="form.send"></span> <span class="arw">→</span></button>
          <a class="btn btn-wa" id="wa-contact" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35z"/><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.15l-.3-.18-3.1.81.83-3.02-.2-.31A8.2 8.2 0 1112 20.2z"/></svg>
            <span data-t="wa.ask"></span></a>
        </form>
      </div>
      <aside class="rv stk-lg">
        <div>
          <div class="idx"><b>01</b> <span data-t="contact.location"></span></div>
          <p class="t-h3" style="margin-block-start:1rem" data-t="contact.dubai"></p>
          <p class="sm dim" style="margin-block-start:.5rem" data-t="footer.division"></p>
        </div>
        <div>
          <div class="idx"><b>02</b> <span data-t="contact.faster"></span></div>
          <div class="ledger" style="margin-block-start:1rem">
            <a class="led" style="grid-template-columns:1fr auto" href="ask-an-engineer.html"><h3 style="font-size:1rem" data-t="contact.r1"></h3><span class="go">→</span></a>
            <a class="led" style="grid-template-columns:1fr auto" href="request-quote.html"><h3 style="font-size:1rem" data-t="contact.r2"></h3><span class="go">→</span></a>
            <a class="led" style="grid-template-columns:1fr auto" href="solar-study.html"><h3 style="font-size:1rem" data-t="contact.r3"></h3><span class="go">→</span></a>
            <a class="led" style="grid-template-columns:1fr auto" href="installation.html"><h3 style="font-size:1rem" data-t="contact.r4"></h3><span class="go">→</span></a>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>
<div id="slot-footer"></div>

<script>
  // Built at runtime so the pre-filled message follows the chosen language.
  function wireWa(){ const a=document.getElementById('wa-contact'); if(a) a.href=ortWhatsApp(); }
  document.addEventListener('DOMContentLoaded', wireWa);
  document.addEventListener('ort:lang', wireWa);
</script>

</html>
