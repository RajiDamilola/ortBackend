<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">

<meta name="color-scheme" content="light">

<script>try{var m=localStorage.getItem('ort-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',m);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  .hmc .ch-box{background:transparent;border:0;padding:0;max-block-size:none;transform:none;}

  <section class="phead">

<script src="js/phone.js"></script>

<script>
