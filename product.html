<script>
(function(){

if(observer)observer.disconnect();const p=ORT_PRODUCTS.find(x=>x.slug===slug)||(!slug?ORT_PRODUCTS[0]:null);if(!p){document.getElementById('main').innerHTML='<div class="wrap" style="padding:5rem 0"><h1>'+local('Product unavailable','Produit indisponible','المنتج غير متاح')+'</h1><a href="equipment.html">'+esc(t('nav.equipment'))+'</a></div>';return}

document.getElementById('main').innerHTML=`

<section class="wrap pdp" style="padding-block-end:clamp(3rem,6vw,5rem)"><div class="rv in"><div class="pdp-fig"><div id="galleryStage"></div><span class="tile-mark" style="inset-block-start:1rem;inset-inline-start:1rem">${esc(t('label.'+label))}</span></div><div id="galleryThumbs" class="gallery-thumbs" role="group" aria-label="${esc(local('Product photos','Photos du produit','صور المنتج'))}"></div><div class="gallery-tools"><button type="button" id="photoPrev" aria-label="${esc(local('Previous photo','Photo précédente','الصورة السابقة'))}">←</button><span id="photoStatus" class="photo-status" aria-live="polite"></span><button type="button" id="photoNext" aria-label="${esc(local('Next photo','Photo suivante','الصورة التالية'))}">→</button></div></div>

<section class="sec wrap"><div class="split top" style="gap:clamp(2rem,6vw,5rem)"><div class="rv"><div class="idx"><b>03</b> ${esc(t('product.whySelected'))}</div><ul class="checks one" style="margin-block-start:1.75rem">${bullets(tx.why)}</ul></div><div class="rv d1"><div class="row" style="gap:2rem;align-items:center;margin-block-end:1.5rem">${ortDial(p.score)}<div><div class="idx"><b>04</b> ${esc(t('score.label'))}</div><p class="sm muted" style="margin-block-start:1rem">${esc(t('score.tapHint'))}</p></div></div><div id="crit-mount"></div></div></div></section>

const thumbs=document.getElementById('galleryThumbs'),stage=document.getElementById('galleryStage'),dialog=document.getElementById('photoDialog');let selected=0;
function photoNode(item,index){if(item.figure){const div=document.createElement('div');div.innerHTML=ortFig(p);return div}const img=document.createElement('img');img.src=item.url;img.alt=p.brand+' '+p.model+' — '+(index+1);img.loading=index?'lazy':'eager';img.onerror=()=>{const note=document.createElement('span');note.className='photo-error';note.textContent=local('Photo unavailable','Photo indisponible','الصورة غير متاحة');img.replaceWith(note)};return img}
media.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='gallery-thumb';b.setAttribute('aria-label',local('Photo','Photo','صورة')+' '+(i+1));b.append(photoNode(item,i));b.onclick=()=>select(i);thumbs.append(b)});
function select(i){selected=(i+media.length)%media.length;const item=media[selected];stage.replaceChildren(photoNode(item,selected));stage.classList.toggle('gallery-open',!!item.url);stage.tabIndex=item.url?0:-1;stage.setAttribute('role',item.url?'button':'img');stage.setAttribute('aria-label',local('Enlarge photo','Agrandir la photo','تكبير الصورة'));[...thumbs.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(j===selected)));document.getElementById('photoStatus').textContent=(selected+1)+' / '+media.length}
function enlarge(){const item=media[selected];if(!item.url)return;document.getElementById('largePhoto').src=item.url;dialog.showModal()}
stage.onclick=enlarge;stage.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enlarge()}if(e.key==='ArrowRight')select(selected+1);if(e.key==='ArrowLeft')select(selected-1)};document.getElementById('photoPrev').onclick=()=>select(selected-1);document.getElementById('photoNext').onclick=()=>select(selected+1);document.getElementById('closePhoto').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};if(media.length===1){thumbs.hidden=true;document.querySelector('.gallery-tools').hidden=true}select(0);

}
