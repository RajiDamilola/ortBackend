<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Installation — ORT WATT</title>
<meta name="description" content="Professional solar installation coordinated by ORT through verified local installers.">
<meta name="color-scheme" content="light">
<script>try{var m=localStorage.getItem('ort-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',m);document.querySelector('meta[name="color-scheme"]').setAttribute('content',m);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/components.css">

</head>
<body data-page-title="nav.installation" data-page-desc="install.sub">
<div id="slot-gate"></div>
<div id="slot-header"></div>
<main id="main">

  <section class="phead">
    <div class="phead-in">
      <nav class="crumbs"><a href="index.html" data-t="err.home"></a> <span>/</span> <span data-t="nav.installation"></span></nav>
      <h1 data-t="install.title"></h1>
      <p class="lede" data-t="install.sub"></p>
    </div>
  </section>
  <section class="sec wrap">
    <div class="idx rv" style="margin-block-end:2rem"><b>01</b> <span data-t="install.how"></span></div>
    <div class="rail rv" style="grid-template-columns:repeat(6,1fr)">
      <div class="rail-s"><span class="n">01</span><h4 data-t="install.s1"></h4><p data-t="install.s1d"></p></div><div class="rail-s"><span class="n">02</span><h4 data-t="install.s2"></h4><p data-t="install.s2d"></p></div><div class="rail-s"><span class="n">03</span><h4 data-t="install.s3"></h4><p data-t="install.s3d"></p></div><div class="rail-s"><span class="n">04</span><h4 data-t="install.s4"></h4><p data-t="install.s4d"></p></div><div class="rail-s"><span class="n">05</span><h4 data-t="install.s5"></h4><p data-t="install.s5d"></p></div><div class="rail-s"><span class="n">06</span><h4 data-t="install.s6"></h4><p data-t="install.s6d"></p></div>
    </div>
    <style>
      /* Stage rail. Two columns on a phone left each stage about 130px
         wide, which squeezed the copy; below 600px it becomes a single
         column. The !important was removed — it was overriding the
         global mobile rule rather than cooperating with it. */
      @media(max-width:1000px){.rail{grid-template-columns:repeat(2,minmax(0,1fr));}}
      @media(max-width:600px){.rail{grid-template-columns:minmax(0,1fr);row-gap:1.5rem;}}
    </style>
  </section>

  <section class="sec light">
    <div class="wrap split" style="align-items:center">
      <div class="rv">
        <span class="badge b-approved"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.verified"></span></span>
        <h2 class="t-h2" style="margin-block-start:1.5rem" data-t="install.verifiedBody"></h2>
      </div>
      <ul class="checks one rv d1"><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.v1"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.v2"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.v3"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.v4"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.v5"></span></li></ul>
    </div>
  </section>

  <section class="sec wrap">
    <div class="split top">
      <div class="rv">
        <div class="idx"><b>02</b> <span data-t="install.pricing"></span></div>
        <p class="lede" style="margin-block-start:1.5rem" data-t="install.pricingBody"></p>
        <ul class="checks one" style="margin-block-start:1.5rem"><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p1"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p2"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p3"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p4"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p5"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p6"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p7"></span></li><li><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg><span data-t="install.p8"></span></li></ul>
      </div>
      <div class="rv d1" style="border:1px solid var(--hair);padding:clamp(1.5rem,3vw,2.25rem)">
        <h3 class="t-h3" style="margin-block-end:1.5rem" data-t="install.requestTitle"></h3>
        <form class="form" id="inst-form" novalidate>
          <div class="msg err" hidden></div><div class="msg ok" hidden></div>
          <div class="f2">
  <div class="fld">
    <label for="full_name"><span data-t="form.fullName"></span></label>
    <input id="full_name" name="full_name" type="text" required data-t-ph="form.namePh">
    <div class="err-msg"></div>
  </div>
  <div class="fld">
    <label for="email"><span data-t="form.email"></span></label>
    <input id="email" name="email" type="email" required data-t-ph="form.emailPh">
    <div class="err-msg"></div>
  </div></div>
          <div class="f2">
  <div class="fld">
    <label for="country"><span data-t="form.country"></span></label>
    <input id="country" name="country" type="text" required>
    <div class="err-msg"></div>
  </div>
  <div class="fld">
    <label for="city"><span data-t="form.city"></span></label>
    <input id="city" name="city" type="text" required>
    <div class="err-msg"></div>
  </div></div>
          <div class="f2">
            <div class="fld"><label for="project_type" data-t="install.projectType"></label><select id="project_type" name="project_type"></select></div>
            <div class="fld"><label for="owns" data-t="install.ownsEquipment"></label><select id="owns" name="owns"></select></div>
          </div>
          
  <div class="fld">
    <label for="message" data-t="install.siteLabel"></label>
    <textarea id="message" name="message" required data-t-ph="install.sitePh"></textarea>
    <div class="err-msg"></div>
  </div>
          
  <div class="fld">
    <label for="files"><span data-t="form.files"></span> <span class="opt">(<span data-t="form.optional"></span>)</span></label>
    <input id="files" name="files" type="file" multiple accept="image/*,.pdf">
    <div class="hint" data-t="form.filesHint"></div>
  </div>
          <button class="btn btn-signal" type="submit"><span data-t="form.submit"></span> <span class="arw">→</span></button>
        </form>
      </div>
    </div>
  </section>
</main>
<div id="slot-footer"></div>
<script src="js/theme.js"></script>
<script src="js/strings.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/phone.js"></script>
<script src="js/layout.js"></script>
<script>function fill(){
    document.getElementById('project_type').innerHTML=['residential','commercial','industrial'].map(k=>'<option>'+t('install.'+k)+'</option>').join('');
    document.getElementById('owns').innerHTML=['ownNo','ownYes','ownPartly'].map(k=>'<option>'+t('install.'+k)+'</option>').join('');}
  document.addEventListener('DOMContentLoaded',fill);document.addEventListener('ort:lang',fill);
  ortWireForm('inst-form','installation');</script>
</body>
</html>
